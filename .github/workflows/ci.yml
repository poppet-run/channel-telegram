name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    uses: poppet-run/workflows/.github/workflows/lint.yml@main
    with:
      poppet: true
  test:
    uses: poppet-run/workflows/.github/workflows/test.yml@main
    with:
      poppet: true
